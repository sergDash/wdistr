# Консоль живой среды: шрифт с кириллицей.
# Опыт 2026-10-12: без этого файла systemd откатывается на дефолтный
# шрифт ядра, в котором нет кириллических глифов — после переключения
# раскладки keyd русские буквы печатаются квадратиками. ter-u16n
# (Terminus Unicode из пакета terminus-font) кириллицу содержит —
# проверено setfont в живой среде. KEYMAP=us — базовая раскладка,
# переключение по тапу Shift делает keyd.
KEYMAP=us
FONT=ter-u16n
