; Системный дефолт конфигурации Flameshot (wdistr).
;
; flameshot хранит настройки в QSettings (INI, UserScope). При чтении
; UserScope падает к системному скоупу — /etc/xdg/flameshot/flameshot.ini
; служит дефолтом для всех пользователей (проверено на Qt 6.12: личный
; ~/.config/flameshot/flameshot.ini перекрывает системный построчно,
; недостающие ключи берутся из системного).
;
; Комментарии — ТОЛЬКО через «;»: QSettings в INI-формате не знает
; «#» как комментарий, такая строка разбирается как ключ настройки
; (опыт установки 2026-10-19: «# captureActiveMonitor» давал ошибку
; «Неизвестная настройка» при первом запуске).
;
; useX11LegacyScreenshot=true — «Использовать устаревший метод сника X11
; (не рекомендуется)». Включено на рабочей машине (запрос 2026-10-17):
; на X11-сессии Cinnamon штатный путь через xdg-desktop-portal
; нестабилен, flameshot сам предупреждает об устаревании метода.
;
; captureActiveMonitor=true — «Захватывать активный монитор (пропустить
; выбор мониторов)»: PrtScr снимает сразу текущий монитор без
; дополнительного шага выделения (запрос 2026-10-17).
;
; startupLaunch=true — «Запускать в фоне при старте» (решение
; 2026-10-19): галка в настройках flameshot. Раньше автозапуск давал
; чужой системный файл /etc/xdg/autostart/flameshot.desktop — flameshot
; про него не знает (его verifyLaunchFile ищет только Flameshot.desktop
; с большой буквы в каталогах конфига), галка оставалась снятой, а
; запуск шёл. Теперь источник истины — собственный механизм flameshot:
; ключ startupLaunch + посев ~/.config/autostart/Flameshot.desktop
; первого пользователя (файл в точности тот, что flameshot сам пишет
; при включении галки — снятие галки его удалит и запуск остановится).
;
; showDesktopNotification=false, showAbortNotification=false —
; всплывающие уведомления о снимке и о прерванном выделении отключены
; (запрос 2026-10-19): flameshot работает в трее молча, оконные
; подсказки лишние.
; showStartupLaunchMessage=false — приветственное окно при старте
; отключено (запрос 2026-10-19): вторичные вопросы дистрибутива не
; задаются (тот же принцип, что у emote).

[General]
useX11LegacyScreenshot=true
captureActiveMonitor=true
startupLaunch=true
showDesktopNotification=false
showAbortNotification=false
showStartupLaunchMessage=false
