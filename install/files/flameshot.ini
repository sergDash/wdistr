# Системный дефолт конфигурации Flameshot (wdistr).
#
# flameshot хранит настройки в QSettings (INI, UserScope). При чтении
# UserScope падает к системному скоупу — /etc/xdg/flameshot/flameshot.ini
# служит дефолтом для всех пользователей (проверено на Qt 6.12: личный
# ~/.config/flameshot/flameshot.ini перекрывает системный построчно,
# недостающие ключи берутся из системного).
#
# useX11LegacyScreenshot=true — «Использовать устаревший метод сника X11
# (не рекомендуется)». Включено на рабочей машине (запрос 2026-10-17):
# на X11-сессии Cinnamon штатный путь через xdg-desktop-portal
# нестабилен, flameshot сам предупреждает об устаревании метода.
#
# captureActiveMonitor=true — «Захватывать активный монитор (пропустить
# выбор мониторов)»: PrtScr снимает сразу текущий монитор без
# дополнительного шага выделения (запрос 2026-10-17).

[General]
useX11LegacyScreenshot=true
captureActiveMonitor=true
