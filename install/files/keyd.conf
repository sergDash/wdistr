# Раскладки и хоткеи клавиатуры.
# Перенесено из конфига serg (/etc/keyd/default.conf на хосте, 2026-09-26)
# с адаптацией: путь скрипта — системный, хвостовые варианты убраны.

[ids]
*

[main]
# Caps Lock: короткое нажатие — Alt+Tab (переключение окон),
# удержание — слой alt_tab (в нём Tab работает как Tab, Caps — не работает)
capslock = layerm(alt_tab, A-tab)

# Shift: короткое нажатие — переключение раскладки us/ru,
# удержание — обычный Shift
leftshift = overload(shift, command(/usr/local/bin/keyd-toggle-layout))
rightshift = overload(shift, command(/usr/local/bin/keyd-toggle-layout))

[alt_tab:A]
capslock = noop
tab = tab
