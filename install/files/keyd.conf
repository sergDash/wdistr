# Раскладки и хоткеи клавиатуры.
# Перенесено из конфига serg (/etc/keyd/default.conf на хосте, 2026-09-26)
# с адаптацией: путь скрипта — системный, хвостовые варианты убраны.
#
# Изменение 2026-10-08: переключение раскладки переехало с Shift на Caps
# Lock — Shift остался чистым модификатором (наглядный тест показал, что
# тап-Shift удобно ломается при эмуляции ввода, а физический Caps
# нажимается однозначно). Alt+Tab на капсе убран: физический Alt+Tab в
# XFCE работает штатно, слой alt_tab больше никем не используется.

[ids]
*

[main]
# Caps Lock: нажатие — переключение раскладки us/ru
# (скрипт переключает и X через setxkbmap, и консоль через loadkeys)
capslock = command(/usr/local/bin/keyd-toggle-layout)

# Shift — обычный модификатор, без переключения раскладки
leftshift = shift
rightshift = shift
