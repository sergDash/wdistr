# Системные GTK3-настройки wdistr: тема оформления и тема иконок по
# умолчанию для ВСЕХ пользователей, включая root (решение 2026-09-30).
#
# GTK3 читает этот файл нижним слоем; ~/.config/gtk-3.0/settings.ini
# конкретного пользователя его перекрывает. В XFCE сессионный xfsettingsd
# может раздавать свои значения поверх (XSETTINGS главнее) — после ухода
# XFCE, с появлением wdesktop, этот файл остаётся единственным источником.
#
# GTK2-программ в составе нет, /etc/gtk-2.0/gtkrc не заводим.
[Settings]
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Papirus
