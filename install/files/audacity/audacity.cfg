# Тема интерфейса Audacity (решение 2026-10-18): панели Audacity
# (тулбары, шкала, нижняя панель) рисуются собственной системой тем
# classic/light/dark/custom — GTK/dconf-тему приложение не читает,
# без этой строки действует дефолт classic (светлые панели при тёмной
# системе; проверено на установке 2026-10-18). Audacity сама допишет
# остальные настройки при первом запуске.
[GUI]
Theme=dark
